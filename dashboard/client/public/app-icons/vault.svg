<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Vaultwarden: a safe, drawn to match files.png. Same chassis grey, same
       slate outline. Amber rather than blue, so it reads as a different kind
       of thing at a glance in a row of tiles. -->
  <rect width="256" height="256" fill="#f2f4f5"/>

  <!-- Feet, behind the body. -->
  <rect x="44" y="212" width="26" height="22" rx="6" fill="#4a5359"/>
  <rect x="186" y="212" width="26" height="22" rx="6" fill="#4a5359"/>

  <!-- Body -->
  <rect x="26" y="26" width="204" height="192" rx="14" fill="#c9ced2" stroke="#4a5359" stroke-width="9" stroke-linejoin="round"/>

  <!-- Door, inset and a shade darker so the body reads as a frame. -->
  <rect x="52" y="50" width="152" height="144" rx="10" fill="#b0b6ba" stroke="#4a5359" stroke-width="8" stroke-linejoin="round"/>

  <!-- Hinges on the left edge of the door. -->
  <rect x="46" y="76" width="16" height="26" rx="4" fill="#4a5359"/>
  <rect x="46" y="142" width="16" height="26" rx="4" fill="#4a5359"/>

  <!-- Handle on the right edge. -->
  <rect x="196" y="106" width="26" height="34" rx="7" fill="#4a5359"/>

  <!-- Dial. The spokes are the retro tell; without them it is a circle. -->
  <circle cx="128" cy="122" r="42" fill="#4a5359"/>
  <circle cx="128" cy="122" r="27" fill="#c9ced2"/>
  <g stroke="#d98f2b" stroke-width="9" stroke-linecap="round">
    <path d="M128 84v18"/>
    <path d="M128 142v18"/>
    <path d="M90 122h18"/>
    <path d="M148 122h18"/>
  </g>
  <circle cx="128" cy="122" r="11" fill="#d98f2b"/>
</svg>
